version: 3
dependencies:
  services:
    - service:
        $ref: '#/components/services/productSearchBffGraphQLV4'
        data:
          examples:
            - directories:
                - ./graphql_examples
        runOptions:
          $ref: '#/components/runOptions/productSearchBffGraphQLV4Mock'
components:
  sources:
    bffSchema:
      filesystem:
        directory: './contracts'
  services:
    productSearchBffGraphQLV4:
      description: Product Search BFF GraphQL V4
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/bffSchema"
            specs:
              - products_bff.graphqls
  runOptions:
    productSearchBffGraphQLV4Mock:
      graphqlsdl:
        type: mock
        host: localhost
        port: 8080
